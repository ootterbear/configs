# =============================================================================
# tmux 설정 파일
# =============================================================================

# -----------------------------------------------------------------------------
# 기본 설정
# -----------------------------------------------------------------------------

# 터미널 색상 설정
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # iTerm2
set -ag terminal-overrides ",xterm-ghostty:RGB"    # Ghostty
set -ag terminal-overrides ",wezterm:RGB"          # WezTerm

# 히스토리 버퍼 크기 (기본 2000 -> 10000)
set -g history-limit 1000000

# 창 번호를 1부터 시작 (기본값 0)
set -g base-index 1
setw -g pane-base-index 1

# 창을 닫으면 번호 자동 재정렬
set -g renumber-windows on

# Esc 키 딜레이 제거 (vim 사용 시 유용)
set -sg escape-time 0

# 포커스 이벤트 활성화 (vim autoread 등에 유용)
set -g focus-events on

# 확장 키 시퀀스 활성화 (Shift+Enter 등 modifier key 전달)
# -s (server option) 이어야 함. -g 로 쓰면 제대로 동작하지 않음
set -s extended-keys always
set -ag terminal-features "xterm-ghostty:extkeys,sync,usstyle,hyperlinks,overline,strikethrough"
set -ag terminal-features "xterm-256color:extkeys,hyperlinks"   # iTerm2
set -ag terminal-features "wezterm:extkeys"           # WezTerm

# -----------------------------------------------------------------------------
# 마우스 설정
# -----------------------------------------------------------------------------

# 마우스 입력 및 스크롤 활성화
set -g mouse on

# -----------------------------------------------------------------------------
# 키 바인딩
# -----------------------------------------------------------------------------

# 설정 파일 리로드: Prefix + r
bind r source-file ~/.tmux.conf \; display-message "설정 리로드 완료!"

# 창 분할 단축키 직관화
# Prefix + | : 세로 분할 (좌우)
# Prefix + - : 가로 분할 (위아래)
unbind '"'
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 새 창 열 때 현재 경로 유지
bind c new-window -c "#{pane_current_path}"

# 창 간 이동: Prefix + h/j/k (vim 스타일)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U

# 마지막 활성 window로 토글: Prefix + l
bind l last-window

# 창 크기 조절: Prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 창(window) 전환: Alt + 화살표 (Prefix 없이)
bind -n M-Left  previous-window
bind -n M-Right next-window

# Codex CLI: Shift+Enter -> Option+Enter-compatible newline
# Scope: panes tagged with @codex_shift_enter=on, plus direct codex foreground commands.
# Other panes receive Shift+Enter unchanged to avoid editor/shell side effects.
bind -n S-Enter if -F '#{||:#{==:#{@codex_shift_enter},on},#{m:*codex*,#{pane_current_command}}}' 'send-keys Escape Enter' 'send-keys S-Enter'

# -----------------------------------------------------------------------------
# 복사 모드 (vim 키 바인딩)
# -----------------------------------------------------------------------------

# vi 모드 활성화
setw -g mode-keys vi

# 복사 모드 진입: Prefix + v (Enter 대신)
bind v copy-mode

# 복사 모드 내 vi 키 바인딩
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# -----------------------------------------------------------------------------
# 상태바 설정
# -----------------------------------------------------------------------------

# 상태바 위치 (top / bottom)
set -g status-position bottom

# 상태바 업데이트 주기 (초)
set -g status-interval 5

# 상태바 색상
set -g status-style "bg=#2d2d2d,fg=#cccccc"

# 왼쪽 상태바: 세션 이름
set -g status-left-length 30
set -g status-left "#[bg=#5f87ff,fg=#000000,bold] #S #[default] "

# 오른쪽 상태바: 날짜 & 시간
set -g status-right-length 60
set -g status-right "#[fg=#888888]%Y-%m-%d #[fg=#cccccc,bold]%H:%M "

# 창 목록 정렬
set -g status-justify left

# 창 탭 스타일
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[bg=#5f87ff,fg=#000000,bold] #I:#W #[default]"

# 활성 창(pane) 테두리 색상
set -g pane-active-border-style "fg=#5f87ff"
set -g pane-border-style        "fg=#444444"

# 메시지 표시 스타일
set -g message-style "bg=#5f87ff,fg=#000000"
