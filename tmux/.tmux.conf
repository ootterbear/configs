# =============================================================================
# tmux 설정 파일
# =============================================================================

# -----------------------------------------------------------------------------
# 기본 설정
# -----------------------------------------------------------------------------

# 터미널 색상 설정
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # iTerm2
set -ag terminal-overrides ",xterm-ghostty:RGB"    # Ghostty
set -ag terminal-overrides ",wezterm:RGB"          # WezTerm

# 히스토리 버퍼 크기 (기본 2000 -> 10000)
set -g history-limit 1000000

# 창 번호를 1부터 시작 (기본값 0)
set -g base-index 1
setw -g pane-base-index 1

# 창을 닫으면 번호 자동 재정렬
set -g renumber-windows on

# Esc 키 딜레이 제거 (vim 사용 시 유용)
set -sg escape-time 0

# 포커스 이벤트 활성화 (vim autoread 등에 유용)
set -g focus-events on

# 확장 키 시퀀스 활성화 (Shift+Enter 등 modifier key 전달)
# -s (server option) 이어야 함. -g 로 쓰면 제대로 동작하지 않음
set -s extended-keys always
set -ag terminal-features "xterm-ghostty:extkeys:sync:usstyle:hyperlinks:overline:strikethrough"
set -ag terminal-features "xterm-256color:extkeys:hyperlinks"   # iTerm2
set -ag terminal-features "wezterm:extkeys"           # WezTerm

# -----------------------------------------------------------------------------
# 마우스 설정
# -----------------------------------------------------------------------------

# 마우스 입력 및 스크롤 활성화
set -g mouse on

# -----------------------------------------------------------------------------
# 키 바인딩
# -----------------------------------------------------------------------------

# 설정 파일 리로드: Prefix + r
bind r source-file ~/.tmux.conf \; display-message "설정 리로드 완료!"

# 창 분할 단축키 직관화
# Prefix + | : 세로 분할 (좌우)
# Prefix + - : 가로 분할 (위아래)
unbind '"'
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 새 창 열 때 현재 경로 유지
bind c new-window -c "#{pane_current_path}"

# yazi 를 popup(오버레이)으로 호출: Prefix + f
# - display-popup 은 새 창/분할이 아니라 지금 pane 위에 뜨는 임시 상자다.
#   안에서 명령이 끝나면 사라지고 원래 화면으로 돌아온다(레이아웃 불변, 뒤 프로세스 무영향).
# - -E : 명령 종료 시 popup 자동 닫기
# - -w/-h 90% : 화면 대비 크기
# - -d : 시작 디렉터리(현재 pane 의 cwd)
# - -T : 테두리 제목
# - 래퍼 ~/.local/bin/tmux-yazi 가 yazi 의 --chooser-file/--cwd-file 을 읽어
#   고른 파일 경로(없으면 마지막 디렉터리)를 tmux 버퍼에 넣는다 → 닫은 뒤 Prefix + ] 로 붙여넣기.
bind f display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T " yazi " "/home/allen/.local/bin/tmux-yazi"

# 창 간 이동: Prefix + h/j/k (vim 스타일)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U

# 마지막 활성 window로 토글: Prefix + l
bind l last-window

# 창 크기 조절: Prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 창(window) 전환: Alt + 화살표 (Prefix 없이)
bind -n M-Left  previous-window
bind -n M-Right next-window

# Shift+Enter -> Option+Enter (모든 pane)
# send-keys M-Enter 는 pane 의 앱이 확장 키(kitty/CSI u)를 켰으면 CSI 13;3u,
# 아니면 ESC CR 로 보내므로 Claude Code·codex·vim 어디서든 Option+Enter 와 같다.
# 터미널(Ghostty/iTerm2)은 Shift+Enter 를 바꾸지 말고 확장 키 그대로 넘겨야 한다.
bind -n S-Enter send-keys M-Enter

# -----------------------------------------------------------------------------
# 복사 모드 (vim 키 바인딩)
# -----------------------------------------------------------------------------

# vi 모드 활성화
setw -g mode-keys vi

# 복사 모드 진입: Prefix + v (Enter 대신)
bind v copy-mode

# 복사 모드 내 vi 키 바인딩
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# -----------------------------------------------------------------------------
# 상태바 설정
# -----------------------------------------------------------------------------

# 상태바 위치 (top / bottom)
set -g status-position bottom

# 상태바 업데이트 주기 (초)
set -g status-interval 5

# 상태바 색상 — habamax 팔레트 (Ghostty 테마 habamax / Vim colorscheme habamax)
#   bg #1c1c1c  fg #bcbcbc  blue #5f87af  dim #767676
#   yellow #af875f  bright-yellow #d7af87  light #9e9e9e
set -g status-style "bg=#1c1c1c,fg=#bcbcbc"

# 왼쪽 상태바: 세션 이름
set -g status-left-length 30
set -g status-left "#[bg=#5f87af,fg=#000000,bold] #S #[default] "

# 오른쪽 상태바: prefix 상태 표시 + 날짜 & 시간
set -g status-right-length 60
set -g status-right "#{prefix_highlight}#[fg=#767676]%Y-%m-%d #[fg=#bcbcbc,bold]%H:%M "

# prefix 눌림/복사모드 표시 색 (tmux-prefix-highlight)
set -g @prefix_highlight_fg '#000000'
set -g @prefix_highlight_bg '#d7af87'

# 창 목록 정렬
set -g status-justify left

# 창 탭 스타일
setw -g window-status-format         "#[fg=#9e9e9e] #I:#W #[default]"
setw -g window-status-current-format "#[bg=#5f87af,fg=#000000,bold] #I:#W #[default]"

# 활성 창(pane) 테두리 색상
set -g pane-active-border-style "fg=#5f87af"
set -g pane-border-style        "fg=#767676"

# 메시지 표시 스타일
set -g message-style "bg=#5f87af,fg=#000000"

# 입력 대기/출력 발생 창 강조 (에이전트 여러 개 중 어디가 멈췄는지)
setw -g window-status-activity-style "fg=#d7af87,bold"

# -----------------------------------------------------------------------------
# 원격(SSH) 워크플로 옵션
# -----------------------------------------------------------------------------

# 클립보드: 이 서버엔 xclip/wl-copy 가 없고 DISPLAY 도 없다.
# tmux 가 OSC 52 로 클라이언트(Ghostty)에 직접 보낸다.
set -g set-clipboard on

# yazi 이미지/PDF 미리보기 등 클라이언트 기능 통과
set -g allow-passthrough on

# 앱이 창 이름을 바꾸지 못하게 + 자동 이름 변경도 끔 (같은 이름 창 구분용)
set -g allow-rename off
setw -g automatic-rename off

# -----------------------------------------------------------------------------
# 플러그인 (TPM)
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# tmux-yank: 이 서버엔 xclip/wl-copy/pbcopy 가 없다. 그래도 @yank_action 만으로는 안 되고
# (플러그인이 copy 명령을 못 찾으면 바인딩을 에러 메시지로 덮어씀) @override_copy_command 가 필요하다.
# 잡음을 /dev/null 로 버리는 no-op 을 지정 → 선택은 tmux 버퍼에 저장되고, 클립보드 전송은
# 위의 set-clipboard on 이 OSC 52 로 처리한다. prefix+y(현재 줄), prefix+P(cwd), 마우스 드래그 사용.
set -g @override_copy_command 'cat > /dev/null'

# resurrect/continuum: 레이아웃만 복원. 에이전트 프로세스/대화는 복원되지 않는다.
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# prefix 눌림 상태를 상태바에 표시
set -g @prefix_highlight_show_copy_mode 'on'

# TPM 초기화 (파일 맨 끝이어야 함)
run '~/.tmux/plugins/tpm/tpm'
